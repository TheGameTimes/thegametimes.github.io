<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="The Game Times — Gaming news, reviews, features, guides and unapologetic opinions."
  >

  <meta
    name="theme-color"
    content="#060F30"
  >

  <title>The Game Times — Gaming News & Culture</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <header class="site-header">

    <div class="header-inner">

      <a
        href="index.html"
        class="brand"
        aria-label="The Game Times Home"
      >
        THE GAME <span>TIMES</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">

        <a href="index.html">NEWS</a>
        <a href="#">REVIEWS</a>
        <a href="#">GAMES</a>
        <a href="#">FEATURES</a>
        <a href="#">GUIDES</a>

      </nav>

      <div class="header-actions">

        <button
          type="button"
          class="search-button"
          aria-label="Search"
        >
          SEARCH
        </button>

        <a
          href="#"
          class="follow-button"
        >
          FOLLOW
        </a>

      </div>

    </div>

  </header> 

  <!-- =========================
       HERO
  ========================== -->

  <main>

    <section class="hero">

      <div class="hero-inner">

        <div class="hero-content">

          <span class="hero-label">
            THE GAME TIMES
          </span>

          <h1>
            GAMING NEWS.<br>
            <span>WITHOUT THE BULLSHIT.</span>
          </h1>

          <p>
            Gaming news, reviews, features, guides and opinions.
            Straight to the point.
          </p>

          <div class="hero-actions">

            <a
              href="#latest-news"
              class="hero-button primary"
            >
              LATEST NEWS
            </a>

            <a
              href="#reviews"
              class="hero-button secondary"
            >
              REVIEWS
            </a>

          </div>

        </div>

        <div class="hero-status">

          <span class="status-dot"></span>

          <span>
            TGT SYSTEM ONLINE
          </span>

        </div>

      </div>

    </section>
