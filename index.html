<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Game Times</title>
  <meta name="description" content="The Game Times — Gaming news, opinions, guides and reviews.">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a href="index.html" class="brand">
        THE GAME TIMES
      </a>

      <nav class="main-nav">
        <a href="news.html">NEWS</a>
        <a href="reviews.html">REVIEWS</a>
        <a href="#platforms">GAMES</a>
        <a href="articles.html">FEATURES</a>
        <a href="guides.html">GUIDES</a>
      </nav>

      <div class="header-actions">

        <button
  type="button"
  class="search-button"
  id="searchToggle"
  aria-label="Search"
>
  <svg
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <circle cx="11" cy="11" r="6.5"></circle>
    <line x1="16" y1="16" x2="21" y2="21"></line>
  </svg>
        </button>

        <a href="#" class="follow-button">
          FOLLOW
        </a>

      </div>

    </div>
    </header>

  <div class="search-panel" id="searchPanel">
    <div class="search-panel-inner">

      <input
        type="text"
        id="searchInput"
        placeholder="Search The Game Times..."
        autocomplete="off"
      >

      <button
        type="button"
        id="searchClose"
        aria-label="Close search"
      >
        CLOSE
      </button>

    </div>
  </div>

</body>
</html>
