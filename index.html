<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Game Times</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->

  <header class="site-header">

    <a href="index.html" class="brand">
      THE GAME TIMES
    </a>

    <div class="header-actions">

      <button class="search-button" id="searchToggle" aria-label="Search">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5"></circle>
          <line x1="16" y1="16" x2="21" y2="21"></line>
        </svg>
      </button>

      <a href="#" class="follow-button">
        FOLLOW
      </a>

    </div>

  </header>


  <!-- SEARCH -->

  <div class="search-panel" id="searchPanel">

    <input
      type="text"
      id="searchInput"
      placeholder="Search The Game Times..."
    >

  </div>


  <!-- MAIN -->

  <main>

    <!-- HERO CAROUSEL -->

<section class="hero-section">

  <div class="hero-carousel" id="heroCarousel">

    <button class="carousel-arrow carousel-prev" id="carouselPrev">
      ‹
    </button>

    <div class="carousel-track" id="carouselTrack">
      <!-- Dynamic slides will appear here -->
    </div>

    <button class="carousel-arrow carousel-next" id="carouselNext">
      ›
    </button>

  </div>

</section>


    <!-- NEWS -->

    <section class="content-section">

      <div class="section-heading">
        <h2>NEWS</h2>
        <a href="news.html">VIEW ALL</a>
      </div>

      <div class="content-grid" id="latestNews">
        <!-- Dynamic news will go here -->
      </div>

    </section>


    <!-- ARTICLES -->

    <section class="content-section">

      <div class="section-heading">
        <h2>ARTICLES</h2>
        <a href="articles.html">VIEW ALL</a>
      </div>

      <div class="content-grid" id="latestArticles">
        <!-- Dynamic articles will go here -->
      </div>

    </section>


    <!-- REVIEWS -->

    <section class="content-section">

      <div class="section-heading">
        <h2>REVIEWS</h2>
        <a href="reviews.html">VIEW ALL</a>
      </div>

      <div class="content-grid" id="latestReviews">
        <!-- Dynamic reviews will go here -->
      </div>

    </section>


    <!-- FREE GAMES -->

    <section class="content-section free-games-section">

      <div class="section-heading">
        <h2>FREE GAMES</h2>
        <a href="free-games.html">VIEW ALL</a>
      </div>

      <div id="freeGames">
        <!-- Free games + affiliate content will go here -->
      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer class="site-footer">

    <div class="footer-brand">
      THE GAME TIMES
    </div>

    <p>Gaming news. Without the bullshit.</p>

  </footer>


</body>
      </html>
